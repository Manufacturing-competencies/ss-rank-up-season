<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SS Rank Up Season</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="/style.css"
  />
</head>

<body>

  <header class="topbar">

    <div class="brand">

      <div class="brand-mark"></div>

      <div>
        <div class="brand-title">
          SS RANK UP
        </div>

        <div class="brand-subtitle">
          SEASON
        </div>
      </div>

    </div>


    <div class="user-panel">

      <button
        class="music-button"
        id="musicButton"
        type="button"
      >
        II
      </button>

      <div
        class="avatar"
        id="avatar"
      >
        --
      </div>

      <div class="user-copy">

        <div
          class="user-name"
          id="userName"
        >
          LOADING...
        </div>

        <div
          class="user-role"
          id="userRole"
        >
          USER
        </div>

      </div>

      <button
        class="logout-button"
        id="logoutButton"
        type="button"
      >
        LOGOUT
      </button>

    </div>

  </header>


  <main class="page">

    <section class="hero">

      <div class="hero-content">

        <div class="hero-copy">

          <div class="season-chip">

            <span class="season-dot"></span>

            SEASON ACTIVE

          </div>

          <div class="welcome">
            Welcome back,
          </div>

          <h1
            class="hero-name"
            id="heroName"
          >
            LOADING...
          </h1>

          <p class="hero-description">
            Turn every idea into impact.
            Complete your improvement and climb the rank.
          </p>

        </div>


        <div
          class="rank-zone"
          id="rankZone"
        >

          <div class="rank-aura aura-one"></div>
          <div class="rank-aura aura-two"></div>

          <div
            class="rank-emblem"
            id="rankEmblem"
          >

            <img
              id="rankImage"
              src="/assets/ranks/warrior.png"
              alt="Rank emblem"
            />

          </div>

          <div class="rank-label">
            SEASON RANK
          </div>

          <div
            class="rank-name"
            id="rankName"
          >
            WARRIOR
          </div>

          <div
            class="rank-count"
            id="rankCount"
          >
            0 SS
          </div>

          <div
            class="season-result"
            id="seasonResult"
          ></div>

          <div
            class="missed-months"
            id="missedMonths"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <audio
    id="bgMusic"
    src="/Rank Up Season.mp3"
    loop
  ></audio>


  <script src="/app.js"></script>

</body>
</html>
