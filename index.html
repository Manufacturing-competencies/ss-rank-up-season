<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SS Rank Up Season</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

  <!-- ===============================
       NAVBAR
  ================================ -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        <span></span>
      </div>

      <div class="brand-copy">

        <div class="brand-title">
          SS RANK UP
        </div>

        <div class="brand-subtitle">
          SEASON
        </div>

      </div>

    </div>


    <div class="user-panel">

      <button
        id="musicButton"
        class="music-button"
        type="button"
        title="Music"
      >
        II
      </button>


      <div
        id="avatar"
        class="avatar"
      >
        --
      </div>


      <div class="user-info">

        <div
          id="headerUserName"
          class="header-user-name"
        >
          LOADING...
        </div>

        <div
          id="headerUserRole"
          class="header-user-role"
        >
          USER
        </div>

      </div>


      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        LOGOUT
      </button>

    </div>

  </header>


  <!-- ===============================
       DASHBOARD
  ================================ -->

  <main class="page">

    <section class="hero">

      <div class="hero-light hero-light-blue"></div>
      <div class="hero-light hero-light-purple"></div>


      <!-- LEFT -->

      <div class="hero-left">

        <div class="season-chip">

          <span class="season-dot"></span>

          <span id="seasonState">
            SEASON ACTIVE
          </span>

        </div>


        <div class="welcome-label">
          Welcome back,
        </div>


        <h1
          id="heroUserName"
          class="hero-user-name"
        >
          LOADING...
        </h1>


        <p class="hero-description">

          Turn every idea into impact.
          Complete your improvement and climb the rank.

        </p>


        <div class="identity-info">

          <span id="departmentText">
            -
          </span>

          <span class="identity-divider">
            •
          </span>

          <span id="locationText">
            -
          </span>

        </div>

      </div>


      <!-- RIGHT / RANK -->

      <div
        id="rankPanel"
        class="rank-panel rank-warrior"
      >

        <div class="outer-ring"></div>
        <div class="inner-ring"></div>

        <div class="rank-glow"></div>


        <div
          id="rankBadge"
          class="rank-badge"
        >

          <div class="rank-badge-core">

            <span
              id="rankBadgeText"
              class="rank-badge-text"
            >
              W
            </span>

          </div>

        </div>


        <div class="rank-label">
          SEASON RANK
        </div>


        <div
          id="rankName"
          class="rank-name"
        >
          WARRIOR
        </div>


        <div
          id="rankTotal"
          class="rank-total"
        >
          0 SS
        </div>


        <div
          id="seasonStatus"
          class="season-status"
        >
          -
        </div>


        <div
          id="missedMonths"
          class="missed-months"
        ></div>

      </div>

    </section>

  </main>


  <!-- MUSIC -->

  <audio
    id="bgMusic"
    src="/Rank Up Season.mp3"
    loop
  ></audio>


  <script src="/app.js"></script>

</body>

</html>
